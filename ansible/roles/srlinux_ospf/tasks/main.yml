---
- name: Assert required Nokia SR Linux variables
  ansible.builtin.assert:
    that:
      - core_ip is defined
      - transit_ip is defined
      - loopback_ip is defined
      - router_id is defined
      - bgp_peers is defined
      - bgp_peers | length > 0
    fail_msg: "Missing required SR Linux routing variables on {{ inventory_hostname }}"

- name: Validate the complete Nokia SR Linux base candidate before applying it
  nokia.srlinux.validate:
    update: "{{ srlinux_candidate }}"

- name: Validate each Nokia SR Linux BGP neighbor before applying it
  nokia.srlinux.validate:
    update:
      - path: "/network-instance[name=default]/protocols/bgp/neighbor[peer-address={{ item.peer_ip }}]"
        value:
          peer-group: "{{ 'ebgp-transit' if item.remote_as != as_number else 'ibgp-core' }}"
          peer-as: "{{ item.remote_as }}"
          description: "{{ item.description }}"
          admin-state: enable
          afi-safi:
            - afi-safi-name: ipv4-unicast
              admin-state: enable
  loop: "{{ bgp_peers }}"
  loop_control:
    label: "{{ item.peer_ip }} AS{{ item.remote_as }}"

- name: Apply the complete Nokia SR Linux base candidate
  nokia.srlinux.config:
    save_when: changed
    update: "{{ srlinux_candidate }}"

- name: Apply each Nokia SR Linux BGP neighbor
  nokia.srlinux.config:
    save_when: changed
    update:
      - path: "/network-instance[name=default]/protocols/bgp/neighbor[peer-address={{ item.peer_ip }}]"
        value:
          peer-group: "{{ 'ebgp-transit' if item.remote_as != as_number else 'ibgp-core' }}"
          peer-as: "{{ item.remote_as }}"
          description: "{{ item.description }}"
          admin-state: enable
          afi-safi:
            - afi-safi-name: ipv4-unicast
              admin-state: enable
  loop: "{{ bgp_peers }}"
  loop_control:
    label: "{{ item.peer_ip }} AS{{ item.remote_as }}"
