---
testbed:
  name: isp-backbone-testbed
  credentials:
    default:
      username: "%ENV{SRL_USER,admin}"
      password: "%ENV{SRL_PASSWORD}"
    frr:
      username: "%ENV{FRR_USER,root}"

devices:
  srl01:
    os: linux
    type: srlinux
    credentials: default
    connections:
      defaults:
        class: unicon.Unicon
      cli:
        protocol: ssh
        ip: 172.20.20.11
        port: 22

  srl02:
    os: linux
    type: srlinux
    credentials: default
    connections:
      defaults:
        class: unicon.Unicon
      cli:
        protocol: ssh
        ip: 172.20.20.12
        port: 22

  frr01:
    os: linux
    type: frr
    credentials: frr
    connections:
      defaults:
        class: unicon.Unicon
      cli:
        protocol: ssh
        ip: 172.20.20.13
        port: 22
        username: "%ENV{FRR_USER,root}"
        private_key: "%ENV{FRR_SSH_KEY}"
