---

name: NetDevOps Backbone CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SRL_USER: admin
  FRR_USER: root
  FRR_SSH_KEY: ${{ github.workspace }}/.lab/ssh/id_ed25519
  CONTAINERLAB_VERSION: 0.71.0

jobs:
  lint:
    name: Code Quality & Contract Validation
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned test dependencies
        run: |
          python -m pip install --requirement pyats/requirements.txt
          python -m pip install ansible-lint==26.9.0 flake8==7.4.1

      - name: Install pinned Ansible collections
        run: |
          mkdir -p ansible/collections
          ansible-galaxy collection install \
            --requirements-file ansible/requirements.yml \
            --collections-path "${GITHUB_WORKSPACE}/ansible/collections" \
            --force
          # Fail loudly with the resolved tree if anything above did not land,
          # so a collection problem names itself instead of surfacing later as
          # an unrelated playbook or lint error.
          ansible-galaxy collection list --collections-path "${GITHUB_WORKSPACE}/ansible/collections"
          for c in nokia.srlinux ansible.netcommon ansible.utils; do
            test -d "${GITHUB_WORKSPACE}/ansible/collections/ansible_collections/${c%%.*}/${c#*.}" \
              || { echo "missing collection: ${c}"; exit 1; }
          done

      - name: Validate cross-file contracts and negative cases
        run: |
          python scripts/validate_contract.py
          python -m pytest -q tests

      - name: Lint YAML
        run: |
          # ansible/collections/ is populated by the previous step from Galaxy and
          # is third-party code we neither own nor can restyle. Linting it made
          # this step fail on upstream formatting while every tracked file passed.
          yamllint -f parsable \
            data/ topology/ observability/ pyats/ \
            .github/workflows/pipeline.yml .github/ISSUE_TEMPLATE/ .github/dependabot.yml \
            || { echo "--- yamllint failed; effective config: .yamllint ---"; cat .yamllint; exit 1; }
          # Lint only the hand-written Ansible YAML, not downloaded collections.
          # ansible.cfg is INI, not YAML, so it is deliberately absent here.
          yamllint -f parsable \
            ansible/site.yml ansible/requirements.yml \
            ansible/group_vars ansible/host_vars ansible/inventories \
            ansible/roles ansible/plugins \
            || { echo "--- yamllint failed on ansible sources ---"; exit 1; }

      - name: Verify Ansible can resolve the installed collections
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/ansible/collections
        # Guards a failure that used to surface much later as an opaque
        # ansible-lint "internal-error": ansible.cfg pinned a relative
        # collections_path, which overrides ANSIBLE_COLLECTIONS_PATH, so a run
        # from the wrong CWD could not resolve nokia.srlinux at all.
        run: |
          ansible-config dump --only-changed
          ansible-galaxy collection list
          ansible-playbook --syntax-check site.yml

      - name: Lint Ansible
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/ansible/collections
        # .ansible-lint lives at the repository root, one level above this
        # working directory, so name it explicitly. Without this the step falls
        # back to ansible-lint's strict defaults and fails on rules this lab
        # declares as intentional in data/lab.yml.
        run: |
          ansible-lint --config "${GITHUB_WORKSPACE}/.ansible-lint" site.yml \
            || { echo "--- ansible-lint failed; config in effect: ---"; cat "${GITHUB_WORKSPACE}/.ansible-lint"; exit 1; }

      - name: Lint Python
        run: |
          # shellcheck disable=SC2086
          flake8 pyats/test_network.py pyats/test_job.py scripts/*.py ansible/plugins/callback/*.py tests/*.py --max-line-length=120 \
            || { echo "--- flake8 failed (line length 120, per pyproject.toml) ---"; exit 1; }

  deploy-and-validate:
    name: Containerlab, Ansible, and pyATS Verification
    # The `secrets` context is NOT available in a job-level `if` (only github,
    # needs, vars and inputs are), so the credential check has to be a step.
    # See "Detect lab credentials" below, which gates every later step.
    if: >-
      needs.lint.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    needs: lint
    timeout-minutes: 45
    env:
      SRL_PASSWORD: ${{ secrets.SRL_PASSWORD }}
    steps:
      - name: Detect lab credentials
        id: creds
        # The live stage needs a real SR Linux credential. Without it the job
        # would fail deep inside the deploy step with a vendor error that says
        # nothing about the missing secret. Decide it here, say so plainly, and
        # skip the rest of the job rather than report a failure that is really
        # a setup gap. The offline `lint` job is the authoritative gate.
        run: |
          # Test the secret with the expressions the validator already trusts,
          # so this step does not introduce a literal-looking assignment.
          if [ "${{ secrets.SRL_PASSWORD }}" = "" ]; then
            echo "::warning title=Lab secret missing::the lab credential is not set, so the live lab stage is skipped."
            echo "The offline quality gates are the signal for this run."
            echo "To enable the live stage, set the repository secret named in"
            echo "docs/EVIDENCE.md, then re-run:"
            echo "  gh secret set SRL_PASSWORD --repo Realms4239/isp-network-as-code"
            echo "See docs/EVIDENCE.md for why the lab password is never committed."
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
          else
            echo "The lab credential is present; running the live lab stage."
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.creds.outputs.has_creds == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.creds.outputs.has_creds == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        if: steps.creds.outputs.has_creds == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl openssh-client coreutils

      - name: Install pinned Containerlab
        if: steps.creds.outputs.has_creds == 'true'
        run: |
          curl -sL https://get.containerlab.dev | bash -s -- --version "${CONTAINERLAB_VERSION}" --verify-checksum
          clab version
          clab version | grep -F "${CONTAINERLAB_VERSION}"

      - name: Install pinned Python and Ansible dependencies
        if: steps.creds.outputs.has_creds == 'true'
        run: |
          python -m pip install --requirement pyats/requirements.txt
          ANSIBLE_COLLECTIONS_PATH="${GITHUB_WORKSPACE}/ansible/collections" \
          ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections

      - name: Prepare ephemeral FRR management key and lab files
        if: steps.creds.outputs.has_creds == 'true'
        run: |
          bash scripts/prepare_lab.sh
          chmod 600 "${FRR_SSH_KEY}"

      - name: Deploy topology and wait for both SR Linux nodes
        if: steps.creds.outputs.has_creds == 'true'
        run: |
          sudo clab deploy -t topology/topology.clab.yml
          sudo clab inspect --all --format json > artifacts-containerlab-inspect.json
          python scripts/wait_for_lab.py --plan data/lab.yml --attempts 30 --delay 10

      - name: Run Ansible configuration (run 1)
        if: steps.creds.outputs.has_creds == 'true'
        run: |
          cd ansible
          ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
          ANSIBLE_COLLECTIONS_PATH="${GITHUB_WORKSPACE}/ansible/collections" \
          ANSIBLE_STDOUT_CALLBACK=lab_json \
          ansible-playbook -i inventories/hosts.ini site.yml > ../artifacts-ansible-run-1.json

      - name: Enforce exact Ansible idempotency (run 2)
        if: steps.creds.outputs.has_creds == 'true'
        run: |
          set +e
          cd ansible
          ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
          ANSIBLE_COLLECTIONS_PATH="${GITHUB_WORKSPACE}/ansible/collections" \
          ANSIBLE_STDOUT_CALLBACK=lab_json \
          ansible-playbook -i inventories/hosts.ini site.yml > ../artifacts-ansible-run-2.json
          rc=$?
          set -e
          cd ..
          if [[ "${rc}" -ne 0 ]]; then
            cat artifacts-ansible-run-2.json
            exit "${rc}"
          fi
          python scripts/check_ansible_result.py artifacts-ansible-run-2.json \
            --plan data/lab.yml --require-idempotent \
            --report artifacts-ansible-check-2.json --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Run protocol and data-plane gates
        if: steps.creds.outputs.has_creds == 'true'
        run: |
          cd pyats
          pyats run job test_job.py --testbed-file testbed.yml 2>&1 | tee ../artifacts-pyats.log

      - name: Collect diagnostics and preserve failure evidence
        # `always()` because it must run on failure — but only once the lab was
        # actually deployed. With no credential the step above never ran, so
        # there are no artifacts, no running topology, and no checkout; running
        # it anyway would fail on missing files and turn an honest skip into a
        # red run.
        if: always() && steps.creds.outputs.has_creds == 'true'
        run: |
          mkdir -p artifacts
          cp -f artifacts-*.* artifacts/ 2>/dev/null || true
          python scripts/lab_evidence.py redact \
            --root artifacts --output artifacts-redacted --secret-env SRL_PASSWORD
          python scripts/lab_evidence.py manifest \
            --root artifacts-redacted --output artifacts-redacted/manifest.json \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo clab inspect --all --format json > artifacts/containerlab-inspect-final.json 2>&1 || true
          sudo clab logs > artifacts/containerlab-logs.txt 2>&1 || true
          sudo docker ps -a --filter name=clab-isp-backbone --format '{{.Names}} {{.Status}}' > artifacts/docker-state.txt || true

      - name: Destroy topology unconditionally
        # Same reasoning as diagnostics: only tear down what was actually
        # deployed. `always()` is still required so a mid-run failure does not
        # leave containers behind.
        if: always() && steps.creds.outputs.has_creds == 'true'
        run: sudo clab destroy -t topology/topology.clab.yml --cleanup

      - name: Upload diagnostics
        if: always() && steps.creds.outputs.has_creds == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase0-diagnostics
          path: artifacts-redacted/
          retention-days: 7
          if-no-files-found: ignore
