name: NetDevOps Backbone CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  SRL_USER: admin
  SRL_PASSWORD: NokiaSrl1!
  FRR_USER: root
  FRR_PASSWORD: frr

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: |
          pip install yamllint ansible-lint flake8

      - name: Lint YAML and Topology
        run: |
          yamllint topology/ ansible/ pyats/

      - name: Lint Ansible Playbooks
        run: |
          ansible-lint ansible/site.yml

      - name: Validate pyATS Test Scripts
        run: |
          python -m py_compile pyats/test_network.py pyats/test_job.py
          flake8 pyats/test_network.py pyats/test_job.py --max-line-length=120

  deploy-and-validate:
    name: Containerlab Spinup, Ansible & pyATS Test
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl sshpass

      - name: Install Containerlab
        run: |
          bash -c "$(curl -sL https://get.containerlab.dev)"

      - name: Install Python & Ansible Dependencies
        run: |
          pip install -r pyats/requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Deploy Containerlab Topology
        run: |
          sudo -E clab deploy -t topology/topology.clab.yml

      - name: Wait for SR Linux JSON-RPC readiness
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 20
            echo "Readiness probe attempt $i..."
            curl -sf -u "$SRL_USER:$SRL_PASSWORD" \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"get","params":{"commands":[{"path":"/system/information/version","datastore":"state"}]}}' \
              http://172.20.20.11/jsonrpc && break || true
          done

      - name: Run Ansible Configuration (Run 1)
        run: |
          cd ansible
          ansible-playbook -i inventories/hosts.ini site.yml

      - name: Assert Ansible Idempotency (Run 2 - Expect 0 Changed)
        run: |
          cd ansible
          OUTPUT=$(ansible-playbook -i inventories/hosts.ini site.yml)
          echo "$OUTPUT"
          # Fail if changed > 0
          echo "$OUTPUT" | grep -E "changed=0.*unreachable=0.*failed=0" || (echo "Idempotency test failed! Changes detected." && exit 1)

      - name: Execute pyATS Automated Test Suites
        run: |
          cd pyats
          pyats run job test_job.py --testbed-file testbed.yml

      - name: Cleanup Containerlab
        if: always()
        run: |
          sudo clab destroy -t topology/topology.clab.yml --cleanup

