name: isp-backbone

mgmt:
  network: mgmt-isp
  ipv4-subnet: 172.20.20.0/24

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixrd2l
    linux:
      image: frrouting/frr:v9.1.0

  nodes:
    srl01:
      kind: nokia_srlinux
      mgmt-ipv4: 172.20.20.11

    srl02:
      kind: nokia_srlinux
      mgmt-ipv4: 172.20.20.12

    frr01:
      kind: linux
      mgmt-ipv4: 172.20.20.13
      binds:
        - ../ansible/roles/frr_bgp/templates/daemons:/etc/frr/daemons:ro

  links:
    # Core Interconnect srl01 <-> srl02
    - endpoints: ["srl01:e1-1", "srl02:e1-1"]
    # Transit link srl01 <-> frr01
    - endpoints: ["srl01:e1-2", "frr01:eth1"]
    # Transit link srl02 <-> frr01
    - endpoints: ["srl02:e1-2", "frr01:eth2"]


