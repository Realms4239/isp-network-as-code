[defaults]
inventory = inventories/hosts.ini
host_key_checking = False
retry_files_enabled = False
callback_plugins = plugins/callback
stdout_callback = default
roles_path = roles
# collections_path is deliberately NOT set here.
#
# A collections_path in this file takes precedence over the
# ANSIBLE_COLLECTIONS_PATH environment variable, and a relative one is
# resolved against the config file, so pinning it here made collection
# resolution depend on the config file rather than on the single value every
# caller already exports. That mismatch is what broke `ansible-playbook
# --syntax-check` (exit 4) and surfaced as an opaque ansible-lint
# "internal-error".
#
# Callers set one absolute path and it is honoured:
#   CI    : ANSIBLE_COLLECTIONS_PATH=${GITHUB_WORKSPACE}/ansible/collections
#   local : scripts/run_local.sh exports ANSIBLE_COLLECTIONS_PATH
interpreter_python = auto_silent
timeout = 60
forks = 20

[persistent_connection]
connect_timeout = 60
command_timeout = 60
