---
- name: Ensure FRR daemons configuration is present
  ansible.builtin.template:
    src: daemons
    dest: /etc/frr/daemons
    mode: '0644'
  notify: Restart FRR

- name: Deploy FRR routing configuration (BGP)
  ansible.builtin.template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    mode: '0640'
    owner: frr
    group: frr
  notify: Reload FRR

